<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b"><title>NOLA | Digital Menu</title>
<style>
:root{--bg:#09090b;--panel:#141115;--red:#ff1738;--red2:#910029;--white:#f5f0ef;--muted:#aaa0a4;--line:#38202a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#291019 0%,var(--bg) 42%);color:var(--white);font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:26px 16px 20px;border-bottom:1px solid var(--line);position:relative}.brand{font:clamp(48px,13vw,76px) Georgia,serif;letter-spacing:9px;direction:ltr;text-shadow:0 0 8px var(--red),0 0 26px #ff173866}.sub{font-size:11px;letter-spacing:5px;color:var(--red);direction:ltr}.tag{font-size:12px;color:var(--muted);margin:13px 0 0}.lang{position:absolute;left:12px;top:12px;background:#171014;color:white;border:1px solid #6c2534;border-radius:20px;padding:8px 12px}
main{max-width:780px;margin:auto;padding:14px 13px 80px}.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0 14px;position:sticky;top:0;background:#09090bf2;z-index:3}.tab{white-space:nowrap;border:1px solid #3b2028;background:#121013;color:#eee;border-radius:22px;padding:11px 15px;font-size:14px;font-weight:700}.tab.active{background:var(--red2);border-color:var(--red);box-shadow:0 0 15px #ff17382a}.title{font:22px Georgia,Tahoma,serif;display:flex;align-items:center;gap:10px;margin:12px 0 15px}.title:after{content:"";height:1px;background:linear-gradient(90deg,var(--red),transparent);flex:1}.title small{font:12px Tahoma;color:var(--red)}.items{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;background:linear-gradient(110deg,#171217,#0f0f11);border:1px solid #2c1c23;border-radius:12px}.name{font-size:14px;line-height:1.6}.description{font-size:12px;line-height:1.8;color:#b8a9ae;margin-top:5px;max-width:46ch}.item{align-items:flex-start}.product-photo{width:86px;height:86px;object-fit:cover;border-radius:9px;border:1px solid #5d1d2b;flex-shrink:0;box-shadow:0 0 16px #ff17381c}.item-main{flex:1;min-width:0}.en{display:block;color:var(--muted);font-size:11px;margin-top:3px}.price{color:var(--red);font-weight:bold;white-space:nowrap;font-size:14px}.pizza-card{display:flex;flex-direction:column;gap:0;padding:16px;border:1px solid #5a202d;border-radius:16px;background:#111114}.pizza-top{display:flex;align-items:flex-start;gap:14px;min-height:154px}.pizza-photo{width:112px;height:150px;object-fit:cover;border-radius:15px;flex-shrink:0}.pizza-info{flex:1;min-width:0;text-align:right;padding-top:34px}.pizza-info .name{color:var(--red);font-weight:bold;font-size:16px}.pizza-divider{height:1px;background:#51202b;margin:16px 0 20px}.pizza-sizes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pizza-size{background:#21171b;border-radius:13px;padding:10px 5px;text-align:center}.pizza-size b{display:block;font-size:13px;color:#f5f0ef}.pizza-size span{display:block;color:var(--red);font-weight:bold;margin-top:7px;font-size:14px}.pizza-foot{font-size:10px;color:#b8a9ae;text-align:right;margin-top:14px}.pizza-card .description{max-width:none}@media(max-width:420px){.pizza-top{min-height:130px;gap:10px}.pizza-photo{width:94px;height:130px}.pizza-info{padding-top:22px}.pizza-size span{font-size:12px}}.muted{text-align:center;color:var(--muted);font-size:12px;padding:20px 4px}footer{position:fixed;bottom:0;left:0;right:0;background:#0b090bf2;border-top:1px solid #4b1a28;padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:10px;font-size:12px;z-index:4;backdrop-filter:blur(12px)}footer b{color:var(--red);direction:ltr}@media(min-width:560px){.items{grid-template-columns:1fr 1fr}}

#welcome{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px 22px;background:radial-gradient(ellipse at 50% 30%,#451321 0%,#160b10 44%,#070709 100%);}
#welcome:before{content:"";position:absolute;inset:18px;border:1px solid #7b2639;pointer-events:none;}
.welcome-inner{position:relative;width:min(100%,480px);display:flex;flex-direction:column;align-items:center;}
.welcome-mark{font:clamp(64px,18vw,96px) Georgia,serif;letter-spacing:12px;direction:ltr;color:#f8f0f1;text-shadow:0 0 10px #ff173866,0 0 36px #ff173833;margin-left:12px;}
.welcome-line{width:72px;height:2px;background:var(--red);margin:18px 0 24px;box-shadow:0 0 12px #ff1738aa;}
.welcome-title{font-size:clamp(21px,5vw,27px);font-weight:700;letter-spacing:.2px;margin:0 0 12px;color:#fff7f8;}
.welcome-sub{font-size:12px;letter-spacing:5px;color:#d75a70;direction:ltr;margin-bottom:40px;}
.enter-menu{border:1px solid var(--red);border-radius:4px;background:linear-gradient(135deg,#b20d2c,#6e071b);color:white;font-family:inherit;font-size:15px;font-weight:700;padding:15px 34px;min-width:190px;box-shadow:0 0 24px #ff17382a;cursor:pointer;transition:transform .2s,box-shadow .2s;}
.enter-menu:active{transform:scale(.98)}
.welcome-caption{color:#a99ba0;font-size:11px;margin-top:18px;letter-spacing:1px;}
body.welcome-mode{overflow:hidden}body.welcome-mode>header,body.welcome-mode>main,body.welcome-mode>footer{visibility:hidden}
.music-card{position:fixed;right:14px;bottom:76px;z-index:8;width:min(300px,calc(100vw - 28px));margin:0;padding:13px;border:1px solid #642536;border-radius:13px;background:linear-gradient(145deg,#1d1117f7,#0d0c0ef7);box-shadow:0 10px 32px #0009,0 0 18px #ff17381a;backdrop-filter:blur(14px)}
.music-card .title{font:bold 13px Tahoma,Arial,sans-serif;margin:0 0 7px;gap:6px}.music-card .title:after{display:none}
.music-card>p{color:#c7b8bd;line-height:1.7;font-size:11px;margin:0 0 9px}
.music-card form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:start}
.music-card input{width:100%;min-width:0;padding:10px;border:1px solid #5b2634;border-radius:8px;background:#09090b;color:#f5f0ef;font:12px Tahoma,Arial,sans-serif}
.music-card button{padding:10px 11px;border:1px solid #ff1738;border-radius:8px;background:linear-gradient(135deg,#a20a2a,#65071b);color:white;font:12px Tahoma,Arial,sans-serif;font-weight:bold;cursor:pointer;white-space:nowrap}
.music-card button:disabled{opacity:.6;cursor:wait}
#music-message{grid-column:1/-1;min-height:0;margin:0;font-size:11px;line-height:1.7;color:#ff9cad}#music-message:empty{display:none}
@media(max-width:420px){.music-card{right:10px;bottom:72px;width:min(285px,calc(100vw - 20px));padding:11px}.music-card form{grid-template-columns:1fr}.music-card button{width:100%}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}


</style>
</head>
<body class="welcome-mode">
<div id="welcome" aria-label="NOLA welcome page">
  <div class="welcome-inner">
    <div class="welcome-mark">NOLA</div>
    <div class="welcome-line"></div>
    <div class="welcome-sub">LOUNGE CAFÉ</div>
    <button class="enter-menu" id="enterMenu">مشاهده منو</button>
  </div>
</div>
<header><button class="lang" id="lang">EN / FA</button><div class="brand">NOLA</div><div class="sub">LOUNGE CAFÉ</div></header>
<main><nav class="tabs" id="tabs"></nav><div id="menu"><p class="muted">در حال بارگذاری منو…</p></div>
<section id="music-request" class="music-card" aria-labelledby="music-title">
<h2 class="title" id="music-title">NOLA MUSIC REQUEST <small>🎵</small></h2>
<p id="music-description">موسیقی بعدی نولا رو تو انتخاب کن! دوست داری چه آهنگی در فضای نولا پخش بشه؟ اسم آهنگ یا خوانندهٔ موردعلاقه‌ات رو برامون بنویس.</p>
<form id="music-form"><label class="sr-only" for="music-song">نام آهنگ یا خواننده</label><input id="music-song" name="song" maxlength="200" required placeholder="نام آهنگ یا خواننده را وارد کنید" autocomplete="off"><button id="music-submit" type="submit">ثبت پیشنهاد موسیقی</button><p id="music-message" role="status" aria-live="polite"></p></form>
</section></main>
<footer><span>ساعت کاری <b>07:00 — 00:00</b></span><span><b>NOLA</b> · <span id="address">جنب لاله پارک، فرشته جنوبی، تبریز</span></span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const cats=[["nola_special","نولا اسپشیال","Nola Special"],["coffee","قهوه","Coffee"],["brew","قهوه‌های دمی","Brewed Coffee"],["hot","نوشیدنی‌های گرم","Hot Drinks"],["tea","دمنوش‌ها","Herbal Tea"],["cold","موکتل","Mocktail"],["mocktail","شیک","Shake"],["breakfast","صبحانه","Breakfast"],["pizza","پیتزا","Pizza"],["burger","برگر","Burger"],["pasta","پاستا","Pasta"],["salad","پیش غذا و سالاد","Appetizers & Salad"], ["dessert","کیک و دسر","Cake & Dessert"],["hookah","قلیان","Hookah"]];
let lang="fa",active="nola_special",items=[];
const $=id=>document.getElementById(id);
function render(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="fa"?"rtl":"ltr";
$("address").textContent=lang==="fa"?"جنب لاله پارک، فرشته جنوبی، تبریز":"Beside Laleh Park, Fereshteh Jonubi, Tabriz";
$("tabs").innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.className="tab"+(active===c[0]?" active":"");b.textContent=lang==="fa"?c[1]:c[2];b.onclick=()=>{active=c[0];render()};$("tabs").appendChild(b)});
let c=cats.find(x=>x[0]===active);let shown=items.filter(x=>x.category===active&&x.active!==false).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
$("menu").innerHTML="";let h=document.createElement("h2");h.className="title";h.innerHTML=(lang==="fa"?c[1]:c[2])+" <small>"+(lang==="fa"?c[2]:c[1])+"</small>";$("menu").appendChild(h);
let grid=document.createElement("div");grid.className="items";
if(!shown.length){grid.innerHTML='<p class="muted">'+(lang==="fa"?"هنوز محصولی در این دسته ثبت نشده است.":"No items in this category yet.")+'</p>'}
function displayPrice(value){const n=Number(value);if(value===null||value===undefined||value===""||!Number.isFinite(n))return "…";return String(Math.round(n>=1000?n/1000:n));}
shown.forEach(it=>{let nm=lang==="fa"?it.name_fa:it.name_en;let alt=lang==="fa"?it.name_en:it.name_fa;const desc=lang==="fa"?it.description_fa:it.description_en;let row=document.createElement("article");if(it.category==="pizza"){row.className="pizza-card";let top=document.createElement("div");top.className="pizza-top";let info=document.createElement("div");info.className="pizza-info";let name=document.createElement("div");name.className="name";name.textContent=nm;let en=document.createElement("span");en.className="en";en.textContent=alt;name.appendChild(en);info.appendChild(name);if(desc){let d=document.createElement("div");d.className="description";d.textContent=desc;info.appendChild(d)}let img=document.createElement("img");img.className="pizza-photo";img.loading="lazy";img.src=it.image_url||"https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=300&q=80";img.alt=nm;img.onerror=()=>img.style.visibility="hidden";top.append(info,img);row.appendChild(top);let line=document.createElement("div");line.className="pizza-divider";row.appendChild(line);let sizes=document.createElement("div");sizes.className="pizza-sizes";[["medium","MEDIUM"],["large","LARGE"]].forEach(([key,label])=>{let box=document.createElement("div");box.className="pizza-size";let b=document.createElement("b");b.textContent=label;let price=document.createElement("span");let v=it["price_"+key];price.textContent=displayPrice(v);box.append(b,price);sizes.appendChild(box)});row.appendChild(sizes)}else{row.className="item";let main=document.createElement("div");main.className="item-main";let name=document.createElement("div");name.className="name";name.textContent=nm;let en=document.createElement("span");en.className="en";en.textContent=alt;name.appendChild(en);main.appendChild(name);if(desc){let d=document.createElement("div");d.className="description";d.textContent=desc;main.appendChild(d)}let price=document.createElement("div");price.className="price";price.textContent=displayPrice(it.price);if(it.image_url){let img=document.createElement("img");img.className="product-photo";img.loading="lazy";img.src=it.image_url;img.alt=nm;img.onerror=()=>img.remove();row.append(img)}row.append(main,price)}grid.appendChild(row)});
$("menu").appendChild(grid);
if(active==="coffee") { const note=document.createElement("p"); note.className="muted"; note.style.padding="14px 4px 4px"; note.textContent=lang==="fa"?"تمامی آیتم ها میتواند با یخ باشد":"All items can be served with ice"; $("menu").appendChild(note); }
}
function updateWelcomeLanguage(){
  $("enterMenu").textContent=lang==="fa"?"مشاهده منو":"VIEW MENU";
}
function updateMusicLanguage(){
$("music-description").textContent=lang==="fa"?"موسیقی بعدی نولا رو تو انتخاب کن! دوست داری چه آهنگی در فضای نولا پخش بشه؟ اسم آهنگ یا خوانندهٔ موردعلاقه‌ات رو برامون بنویس.":"Choose the next song at NOLA! Which song or artist would you love to hear here?";
$("music-song").placeholder=lang==="fa"?"نام آهنگ یا خواننده را وارد کنید":"Enter a song or artist";
$("music-submit").textContent=lang==="fa"?"ثبت پیشنهاد موسیقی":"Submit music request";
}
$("music-form").addEventListener("submit",async(e)=>{
e.preventDefault();
const song=$("music-song").value.trim(), message=$("music-message");
if(!song||song.length>200){message.textContent=lang==="fa"?"لطفاً نام آهنگ یا خواننده را وارد کنید.":"Please enter a song or artist.";return;}
if(!window.NOLA_CONFIG?.supabaseUrl||!window.NOLA_CONFIG?.supabaseAnonKey){message.textContent=lang==="fa"?"ارسال پیشنهاد فعلاً در دسترس نیست.":"Music requests are temporarily unavailable.";return;}
const button=$("music-submit");button.disabled=true;message.textContent=lang==="fa"?"در حال ارسال…":"Sending…";
try{
const client=window.supabase.createClient(NOLA_CONFIG.supabaseUrl,NOLA_CONFIG.supabaseAnonKey);
const {error}=await client.functions.invoke("nola-music-request",{body:{song}});
if(error)throw error;
message.textContent=lang==="fa"?"پیشنهادت ارسال شد!":"Your request has been sent!";$("music-song").value="";
}catch(err){console.error("NOLA music request failed",err);message.textContent=lang==="fa"?"ارسال انجام نشد؛ لطفاً کمی بعد دوباره تلاش کنید.":"Could not send. Please try again later.";}
finally{button.disabled=false;}
});
$("lang").onclick=()=>{lang=lang==="fa"?"en":"fa";render();updateWelcomeLanguage();updateMusicLanguage()};
$("enterMenu").onclick=()=>{ $("welcome").style.display="none"; document.body.classList.remove("welcome-mode"); window.scrollTo(0,0); };
updateWelcomeLanguage();
updateMusicLanguage();
async function loadMenu(){
if(!window.NOLA_CONFIG||!NOLA_CONFIG.supabaseUrl||!NOLA_CONFIG.supabaseAnonKey){items=[];render();return}
try{const sb=window.supabase.createClient(NOLA_CONFIG.supabaseUrl,NOLA_CONFIG.supabaseAnonKey);const {data,error}=await sb.from("menu_items").select("*").eq("active",true).order("sort_order");if(error)throw error;items=data||[];render()}catch(e){items=[];render()}
}
loadMenu();
</script></body></html>
