
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOLA | تست منو</title>
  <style>
    body {
      margin: 0;
      background: #101014;
      color: #f4f0ed;
      font-family: Tahoma, Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      padding: 40px 28px;
      border: 1px solid #910029;
      border-radius: 20px;
      margin: 20px;
    }
    h1 {
      color: #e0003c;
      letter-spacing: 8px;
      font-size: 48px;
    }
    p { line-height: 2; }
  </style>
</head>
<body>
  <main class="card">
    <h1>NOLA</h1>
    <p>منوی آزمایشی کافه نولا</p>
    <p>اگر این صفحه را می‌بینید، میزبانی آزمایشی فعال است.</p>
  </main>
</body>
</html>
